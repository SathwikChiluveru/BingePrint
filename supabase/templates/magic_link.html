<!--
  Supabase Auth → Email Templates → "Magic Link"
  Subject: {{ .Token }} is your Autoplayed sign-in code
  Paste everything below this comment into the message body.
  {{ .Token }} is the 6-digit code the login page asks for; the link still works too.
-->
<div style="background:#141414;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:#ffffff;">
  <div style="max-width:440px;margin:0 auto;background:#1a1a1a;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:32px 24px;">
    <p style="margin:0 0 24px;font-size:20px;font-weight:900;letter-spacing:-0.02em;">Autoplayed</p>
    <p style="margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#8c8c8c;">Your sign-in code</p>
    <p style="margin:0 0 24px;font-size:40px;font-weight:900;letter-spacing:0.2em;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</p>
    <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#b3b3b3;">Type this code on the sign-in page, in the same browser where you made your reel. It expires soon and works once.</p>
    <p style="margin:0 0 24px;">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#e50914;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 24px;border-radius:12px;">Or sign in with this link</a>
    </p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#8c8c8c;">Didn't ask for this? Ignore this email and nothing happens.<br>Autoplayed is not affiliated with Netflix, Inc.</p>
  </div>
</div>
